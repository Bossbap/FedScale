# Configuration file of FAR training experiment

# ========== Cluster configuration ========== 
# ip address of the parameter server (need 1 GPU process)
ps_ip: 129.104.252.34

# ip address of each worker:# of available gpus process on each gpu in this node
# Note that if we collocate ps and worker on same GPU, then we need to decrease this number of available processes on that GPU by 1
# E.g., master node has 4 available processes, then 1 for the ps, and worker should be set to: worker:3
worker_ips:
    - 129.104.253.36:[4]
    - 129.104.252.34:[4]
    - 129.104.252.39:[4]
    - 129.104.252.43:[4]
    - 129.104.252.45:[4]
    - 129.104.252.49:[4]
    - 129.104.252.54:[4]

exp_path: /users/eleves-a/2024/baptiste.geisenberger/FedScale/fedscale/cloud

# Entry function of executor and aggregator under $exp_path
executor_entry: execution/executor.py

aggregator_entry: aggregation/aggregator.py

auth:
    ssh_user: "baptiste.geisenberger"
    ssh_private_key: "/users/eleves-a/2024/baptiste.geisenberger/.ssh/id_rsa"

# cmd to run before we can indeed run FAR (in order)
setup_commands:
    - source /Data/baptiste.geisenberger/miniconda3/bin/activate fedscale
#    - export NCCL_SOCKET_IFNAME='enp0s31f6'         # Run "ifconfig" to ensure the right NIC for nccl if you have multiple NICs

# ========== Additional job configuration ========== 
# Default parameters are specified in config_parser.py, wherein more description of the parameter can be found

job_conf:
    - job_name: openimage_bliss_adapt
    - num_classes: 596
    - task: cv
    - log_path: /users/eleves-a/2024/baptiste.geisenberger/FedScale/benchmark
    - data_set: openImg
    - data_dir: /Data/baptiste.geisenberger/Data/openImg
    - data_map_file: /Data/baptiste.geisenberger/Data/openImg/client_data_mapping/train.csv
    - clients_file: /users/eleves-a/2024/baptiste.geisenberger/FedScale/benchmark/dataset/data/clients.pkl
    - use_cuda: True
    - num_loaders: 2
    - clock_factor: 30
    - checkpoint_interval: 30
    # - resume_from: "/users/eleves-a/2024/baptiste.geisenberger/FedScale/benchmark/logs/openimage_bliss_adapt/1027_220413/checkpoints"

    - model: shufflenet_v2_x2_0
    - openimg_size: 256
    - gradient_policy: fed-prox
    - proxy_mu: 0.001

    - num_participants: 100
    - eval_interval: 5
    - rounds: 500
    - local_steps: 20
    - batch_size: 20
    - filter_less: 20
    - learning_rate: 0.04
    - decay_factor: 0.98
    - decay_round: 10
    - weight_decay: 4e-5
    - test_bsz: 20
    - overcommitment: 1.1

    - sample_mode: bliss
    - adaptive_training: True

    - ema_alpha: 0.9
    - huber_delta: 2000
    - utility_ema_alpha: 0.6
    - recency_weighting_gamma: 0.015
    - sampling_temperature_eta: 1.5

    - t_budget: 120
    - pacer_step: 20
    - pacer_delta: 10

    - g_model: xgboost
    - xgboost_g_n_estimators: 200
    - xgboost_g_learning_rate: 0.05
    - xgboost_g_max_depth: 10
    - xgboost_g_subsample: 0.8
    - xgboost_g_colsample_bytree: 0.6

    - h_model: xgboost
    - xgboost_h_n_estimators: 200
    - xgboost_h_learning_rate: 0.05
    - xgboost_h_max_depth: 7
    - xgboost_h_subsample: 0.8
    - xgboost_h_colsample_bytree: 1.0
